import java.util.Locale

plugins {
    id 'java'
}

group = 'docrouter'
def packageVersion = providers.gradleProperty('version').orElse('0.1.0')
version = packageVersion.get()

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation(platform('com.fasterxml.jackson:jackson-bom:2.20.1'))
    implementation('com.fasterxml.jackson.core:jackson-databind')
    implementation('com.fasterxml.jackson.dataformat:jackson-dataformat-yaml')

    testImplementation(platform('org.junit:junit-bom:5.14.3'))
    testImplementation('org.junit.jupiter:junit-jupiter')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def applicationMainClass = providers.gradleProperty('mainClass').orElse('doc_router.Main')
def applicationName = 'doc-router'
def jpackageInputDirectory = layout.buildDirectory.dir('jpackage/input')
def exeOutputDirectory = layout.buildDirectory.dir('jpackage/exe')
def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')

tasks.register('stageJpackageInput', Sync) {
    dependsOn(tasks.named('jar'))
    from(configurations.runtimeClasspath)
    from(tasks.named('jar'))
    into(jpackageInputDirectory)
}

tasks.register('packageExe', Exec) {
    group = 'distribution'
    description = 'Builds a Windows installer executable for Doc Router.'
    dependsOn(tasks.named('stageJpackageInput'))
    inputs.dir(jpackageInputDirectory)
    inputs.property('mainClass', applicationMainClass)
    inputs.property('version', packageVersion)
    outputs.dir(exeOutputDirectory)

    doFirst {
        if (!isWindows) {
            throw new GradleException('packageExe can only be run on Windows.')
        }

        def jpackageExecutable = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
        }.get().metadata.installationPath.file('bin/jpackage.exe').asFile

        executable(jpackageExecutable)
        args(
            '--type', 'exe',
            '--name', applicationName,
            '--app-version', project.version.toString(),
            '--vendor', 'Doc Router',
            '--dest', exeOutputDirectory.get().asFile.absolutePath,
            '--input', jpackageInputDirectory.get().asFile.absolutePath,
            '--main-jar', tasks.named('jar').get().archiveFileName.get(),
            '--main-class', applicationMainClass.get(),
            '--add-modules', 'java.desktop',
            '--win-dir-chooser',
            '--win-menu',
            '--win-menu-group', 'Doc Router',
            '--win-per-user-install',
            '--win-shortcut'
        )
    }
}
